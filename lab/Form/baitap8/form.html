<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <title>Enter Your Information</title>
</head>

<body>

<form action="config.php" method="post">

    <fieldset>
        <legend>Enter Your Information</legend>

        <table>

            <tr>
                <td>Fullname</td>
                <td>
                    <input type="text"
                           name="fullname">
                </td>
            </tr>

            <tr>
                <td>Address</td>
                <td>
                    <input type="text"
                           name="address">
                </td>
            </tr>

            <tr>
                <td>Phone</td>
                <td>
                    <input type="text"
                           name="phone">
                </td>
            </tr>

            <tr>
                <td>Gender</td>
                <td>
                    <input type="radio"
                           name="gender"
                           value="Nam"
                           checked>
                    Nam

                    <input type="radio"
                           name="gender"
                           value="Nữ">
                    Nữ
                </td>
            </tr>

            <tr>
                <td>Country</td>
                <td>
                    <select name="country">
                        <option value="Việt Nam">
                            Việt Nam
                        </option>

                        <option value="Mỹ">
                            Mỹ
                        </option>

                        <option value="Nhật Bản">
                            Nhật Bản
                        </option>

                        <option value="Hàn Quốc">
                            Hàn Quốc
                        </option>
                    </select>
                </td>
            </tr>

            <tr>
                <td>Study</td>
                <td>
                    <input type="checkbox"
                           name="study[]"
                           value="PHP & MySQL">
                    PHP & MySQL

                    <input type="checkbox"
                           name="study[]"
                           value="ASP.NET">
                    ASP.NET

                    <input type="checkbox"
                           name="study[]"
                           value="CCNA">
                    CCNA

                    <input type="checkbox"
                           name="study[]"
                           value="Security+">
                    Security+
                </td>
            </tr>

            <tr>
                <td>Note</td>
                <td>
                    <textarea name="note"
                              rows="5"
                              cols="50"></textarea>
                </td>
            </tr>

            <tr>
                <td></td>
                <td>
                    <input type="submit"
                           name="submit"
                           value="Gửi">

                    <input type="reset"
                           value="Hủy">
                </td>
            </tr>

        </table>

    </fieldset>

</form>

</body>
</html>
